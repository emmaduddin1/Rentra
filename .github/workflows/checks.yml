name: Application checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    env:
      APP_ENV: testing
      APP_KEY: 'base64:eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      MAIL_MAILER: array
      PUSH_NOTIFICATIONS_ENABLED: 'false'
      FIREBASE_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, pdo_sqlite, gd, fileinfo, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: php artisan test --compact

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:js
      - run: npm run build

  mysql-concurrency:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: 'base64:eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg='
      DB_CONNECTION: mysql
      DB_DATABASE: tenantism_ci_test
      DB_USERNAME: root
      DB_PASSWORD: isolated-ci-only
      DB_HOST: 127.0.0.1
      DB_URL: ''
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_DATABASE: tenantism_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_mysql, gd, fileinfo, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php bin/check-mysql-concurrency.php
        env:
          TENANTISM_AUDIT_MYSQL_DATABASE: tenantism_ci_test
          TENANTISM_AUDIT_MYSQL_PASSWORD: isolated-ci-only
      - run: php artisan test --compact
